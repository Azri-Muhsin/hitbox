[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pytest-hitbox"
version = "0.1.0"
description = "Zero-selector visual localization and canvas QA engine for Playwright and Selenium, powered by TypeSafe Jev."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "pillow>=10.4.0",
    "imagehash>=4.3.1",
]

[project.optional-dependencies]
playwright = ["playwright>=1.48.0", "pytest-playwright>=0.5.2"]
selenium = ["selenium>=4.25.0"]
dev = [
    "pytest>=8.3.0",
    "playwright>=1.48.0",
    "pytest-playwright>=0.5.2",
    "selenium>=4.25.0",
]

[project.entry-points.pytest11]
hitbox = "hitbox.pytest_plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/hitbox"]